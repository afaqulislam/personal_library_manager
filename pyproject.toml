[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-library-manager-cli-aui"
version = "0.1.0"
description = "A command-line manager for organizing, searching, tracking and exporting your personal book collection."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Afaq Ul Islam", email = "afaqulislam707@gmail.com" },
]
maintainers = [
    { name = "Afaq Ul Islam", email = "afaqulislam707@gmail.com" },
]
keywords = [
    "books",
    "book-collection",
    "cli",
    "library",
    "library-manager",
    "reading-tracker",
    "json",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Utilities",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "build>=1.2",
    "twine>=5.0",
]

[project.scripts]
personal_library_manager = "personal_library_manager.cli:main"

[project.urls]
Homepage = "https://github.com/afaqulislam/personal-library-manager"
Repository = "https://github.com/afaqulislam/personal-library-manager"
Issues = "https://github.com/afaqulislam/personal-library-manager/issues"
Changelog = "https://github.com/afaqulislam/personal-library-manager/blob/main/CHANGELOG.md"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src"]
